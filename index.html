<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Repository Viewer</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    
    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-10">
            <h2 class="mb-4 text-center">GitHub Repository Finder</h2>
            
            <!-- Input Area -->
            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <form id="githubForm">
                        <div class="form-group">
                            <label for="username"><strong>GitHub Username:</strong></label>
                            <div class="input-group">
                                <input type="text" id="username" class="form-control" placeholder="Enter username (e.g., octocat)" required>
                                <div class="input-group-append">
                                    <button type="submit" class="btn btn-primary">Search Repositories</button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Error Message Alert (Hidden by default) -->
            <div id="errorMessage" class="alert alert-danger" style="display: none;"></div>

            <!-- Results Table (Hidden by default) -->
            <div class="table-responsive" id="tableContainer" style="display: none;">
                <table class="table table-striped table-bordered table-hover">
                    <thead class="thead-dark">
                        <tr>
                            <th>Repository Name</th>
                            <th>Description</th>
                            <th>Followers (Stars)</th>
                        </tr>
                    </thead>
                    <tbody id="repoTableBody">
                        <!-- Data will be populated here via jQuery -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script>
    $(document).ready(function() {
        $('#githubForm').on('submit', function(e) {
            e.preventDefault(); // Prevent page reload on form submit
            
            let username = $('#username').val().trim();
            let apiUrl = 'https://api.github.com/users/' + username + '/repos';
            
            // Reset UI states
            $('#errorMessage').hide();
            $('#tableContainer').hide();
            $('#repoTableBody').empty();
            
            if (username === "") return;

            // jQuery AJAX GET request to fetch JSON
            $.get(apiUrl)
                .done(function(data) {
                    if (data.length === 0) {
                        $('#errorMessage').text("This user has no public repositories.").show();
                        return;
                    }
                    
                    // Iterate through the JSON array and construct HTML table rows
                    $.each(data, function(index, repo) {
                        let repoName = repo.name;
                        let repoDesc = repo.description ? repo.description : '<em>No description available</em>';
                        let repoStars = repo.stargazers_count; // Using stars to represent repo "followers"
                        let repoUrl = repo.html_url;
                        
                        let row = '<tr>' +
                                      '<td><a href="' + repoUrl + '" target="_blank">' + repoName + '</a></td>' +
                                      '<td>' + repoDesc + '</td>' +
                                      '<td>' + repoStars + '</td>' +
                                  '</tr>';
                        
                        $('#repoTableBody').append(row);
                    });
                    
                    // Display the table once populated
                    $('#tableContainer').show();
                })
                .fail(function(jqXHR) {
                    // Handle API errors (e.g., 404 User Not Found or Rate Limits)
                    if (jqXHR.status === 404) {
                        $('#errorMessage').text("User not found. Please check the username and try again.").show();
                    } else {
                        $('#errorMessage').text("An error occurred while fetching data from GitHub.").show();
                    }
                });
        });
    });
</script>

</body>
</html>
